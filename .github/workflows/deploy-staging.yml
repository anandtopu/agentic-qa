name: deploy-staging

# Triggered on every merge to main. Builds API + Web images, pushes to
# GHCR tagged with the commit SHA, then runs the staging deploy. The
# deploy step is intentionally pluggable: Phase 0 ships only the build
# + push pipeline; the Helm release step is filled in by Phase 3 Story
# 3.6.2 once `infra/helm/qaforge` exists and a real cluster is wired.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (defaults to main HEAD)"
        required: false
        default: ""

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/qaforge-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/qaforge-web

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    outputs:
      api-tag: ${{ steps.meta.outputs.api-tag }}
      web-tag: ${{ steps.meta.outputs.web-tag }}
      sha-short: ${{ steps.meta.outputs.sha-short }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - id: meta
        name: Compute image tags
        run: |
          SHA_SHORT=$(git rev-parse --short=12 HEAD)
          echo "sha-short=$SHA_SHORT" >> "$GITHUB_OUTPUT"
          echo "api-tag=${API_IMAGE}:${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "web-tag=${WEB_IMAGE}:${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: |
            ${{ steps.meta.outputs.api-tag }}
            ${{ env.API_IMAGE }}:staging
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: true
          tags: |
            ${{ steps.meta.outputs.web-tag }}
            ${{ env.WEB_IMAGE }}:staging
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: staging
      url: ${{ vars.STAGING_URL || 'https://staging.qaforge.ai' }}
    steps:
      - uses: actions/checkout@v4

      - name: Helm release (placeholder until infra/helm/qaforge exists)
        if: ${{ hashFiles('infra/helm/qaforge/Chart.yaml') != '' }}
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Configure kubeconfig
        if: ${{ hashFiles('infra/helm/qaforge/Chart.yaml') != '' && env.STAGING_KUBECONFIG != '' }}
        env:
          STAGING_KUBECONFIG: ${{ secrets.STAGING_KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$STAGING_KUBECONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Helm upgrade --install
        if: ${{ hashFiles('infra/helm/qaforge/Chart.yaml') != '' && env.STAGING_KUBECONFIG != '' }}
        env:
          STAGING_KUBECONFIG: ${{ secrets.STAGING_KUBECONFIG }}
        run: |
          helm upgrade --install qaforge infra/helm/qaforge \
            --namespace qaforge-staging --create-namespace \
            --set image.api.repository=${{ env.API_IMAGE }} \
            --set image.api.tag=${{ needs.build-and-push.outputs.sha-short }} \
            --set image.web.repository=${{ env.WEB_IMAGE }} \
            --set image.web.tag=${{ needs.build-and-push.outputs.sha-short }} \
            --wait --timeout 8m

      - name: Smoke test /healthz
        if: ${{ hashFiles('infra/helm/qaforge/Chart.yaml') != '' && env.STAGING_KUBECONFIG != '' }}
        run: |
          URL="${{ vars.STAGING_URL || 'https://staging.qaforge.ai' }}/healthz"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$URL" | grep -q '"ok"'; then
              echo "staging healthy at $URL"
              exit 0
            fi
            echo "attempt $i — staging not ready yet"
            sleep 10
          done
          echo "staging /healthz did not return ok in time" >&2
          exit 1

      - name: Note — deploy skipped
        if: ${{ hashFiles('infra/helm/qaforge/Chart.yaml') == '' }}
        run: |
          echo "::notice::Helm chart at infra/helm/qaforge/ not present yet — skipping deploy."
          echo "Phase 3 Story 3.6.2 lands the chart; this workflow will deploy automatically once it exists."
          echo "Built images: ${{ needs.build-and-push.outputs.api-tag }} and ${{ needs.build-and-push.outputs.web-tag }}"
