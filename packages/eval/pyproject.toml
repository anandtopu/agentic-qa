[project]
name = "aqao-eval"
version = "0.0.0"
description = "Agent evaluation harness — golden datasets, scoring, regression detection"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqao_eval"]
