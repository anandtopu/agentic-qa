[project]
name = "aqao-tools"
version = "0.0.0"
description = "Tool wrappers (Playwright, Newman, pytest, SQL validators) used by agents"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "structlog>=24.4",
  "aqao-redaction",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqao_tools"]

[tool.uv.sources]
aqao-redaction = { workspace = true }
