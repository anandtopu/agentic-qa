[project]
name = "qaforge-agents"
version = "0.0.0"
description = "Specialised QAForge agents (Planner, API, UI, DB, Integration, Triage, Risk, Report, Policy Guard)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qaforge_agents"]
