[project]
name = "aqao-agents"
version = "0.0.0"
description = "Specialised Agentic QA Orchestrator agents (Planner, API, UI, DB, Integration, Triage, Risk, Report, Policy Guard)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "structlog>=24.4",
  "anthropic>=0.40",
  "tenacity>=9.0",
  "jinja2>=3.1",
  "aqao-redaction",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqao_agents"]

[tool.hatch.build.targets.wheel.force-include]
"src/aqao_agents/reporter/templates" = "aqao_agents/reporter/templates"

[tool.uv.sources]
aqao-redaction = { workspace = true }
