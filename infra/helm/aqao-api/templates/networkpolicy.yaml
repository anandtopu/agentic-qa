{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aqao-api.fullname" . }}
  labels:
    {{- include "aqao-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aqao-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- range .Values.networkPolicy.ingress.fromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    # DNS — kube-dns / CoreDNS in kube-system.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        {{- range .Values.networkPolicy.egress.dns.ports }}
        - protocol: UDP
          port: {{ . }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    # Postgres (RDS): allow CIDR or pod selector — env-overridden.
    {{- if .Values.networkPolicy.egress.postgres.selectors }}
    - to:
        {{- range .Values.networkPolicy.egress.postgres.selectors }}
        - {{- toYaml . | nindent 10 }}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.egress.postgres.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    # Redis (ElastiCache).
    {{- if .Values.networkPolicy.egress.redis.selectors }}
    - to:
        {{- range .Values.networkPolicy.egress.redis.selectors }}
        - {{- toYaml . | nindent 10 }}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.egress.redis.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    # LLM provider — tighten to provider's published IP ranges in prod.
    - to:
        {{- range .Values.networkPolicy.egress.llm.cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.egress.llm.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
{{- end -}}
