apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qaforge-api.fullname" . }}
  labels:
    {{- include "qaforge-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "qaforge-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "qaforge-api.selectorLabels" . | nindent 8 }}
      annotations:
        # Force pod restart on config change (Helm-managed checksum).
        checksum/values: {{ toYaml .Values | sha256sum }}
    spec:
      serviceAccountName: {{ include "qaforge-api.serviceAccountName" . }}
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.affinity.preferredAntiAffinity }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "qaforge-api.selectorLabels" . | nindent 20 }}
                topologyKey: topology.kubernetes.io/zone
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: QAFORGE_LOG_LEVEL
              value: {{ .Values.env.log_level | quote }}
            # Secrets are mounted via External Secrets Operator into env vars
            # of the same names; this chart only references them.
            - name: QAFORGE_DATABASE_URL_SECRET
              value: {{ .Values.env.database_url_secret_name | quote }}
            - name: QAFORGE_AUDIT_HMAC_KEY_SECRET
              value: {{ .Values.env.audit_hmac_key_secret_name | quote }}
            - name: QAFORGE_GITHUB_WEBHOOK_SECRET_SECRET
              value: {{ .Values.env.github_webhook_secret_name | quote }}
            - name: QAFORGE_ANTHROPIC_API_KEY_SECRET
              value: {{ .Values.env.anthropic_api_key_secret_name | quote }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.tmpVolume.enabled }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- end }}
      {{- if .Values.tmpVolume.enabled }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpVolume.sizeLimit }}
      {{- end }}
