{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "qaforge-api.serviceAccountName" . }}
  labels:
    {{- include "qaforge-api.labels" . | nindent 4 }}
  {{- if .Values.serviceAccount.awsRoleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.awsRoleArn | quote }}
  {{- end }}
automountServiceAccountToken: true
{{- end -}}
