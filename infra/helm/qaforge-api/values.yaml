# Default values for qaforge-api — Story 3.6.2.
# Every field has a comment so a workspace's overrides file (values-prod.yaml)
# can stay short.

image:
  repository: ghcr.io/qaforge/qaforge-api
  tag: ""              # defaults to .Chart.AppVersion at render time
  pullPolicy: IfNotPresent

# IRSA binding — set to the ARN of the role created by the iam Terraform
# module. Setting an empty string disables the annotation (e.g. local dev).
serviceAccount:
  create: true
  name: ""             # defaults to fullname
  awsRoleArn: ""

replicaCount: 2

# Pod resource shape. Override in values-prod.yaml for production sizing.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Horizontal Pod Autoscaler. Set autoscaling.enabled=false to use the
# fixed replicaCount instead.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Pod Disruption Budget — protects rolling-update + node-drain availability.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Pod Security Standards "restricted" profile — every field is required
# for the namespace to admit the pod once the PSA label is enforced.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Mounted writable volume for /tmp (the rest of the filesystem is RO).
tmpVolume:
  enabled: true
  sizeLimit: 64Mi

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: nginx
  hosts: []
  tls: []
  annotations: {}

# Network policy — egress to Postgres + Redis + DNS + the LLM provider
# CIDR. Override `cidrs` in values-prod.yaml with your provider's
# documented IP ranges.
networkPolicy:
  enabled: true
  egress:
    dns:
      ports: [53]
    postgres:
      ports: [5432]
      selectors: []         # overridden per env (e.g. RDS endpoint via egress IP)
    redis:
      ports: [6379]
      selectors: []
    llm:
      cidrs: ["0.0.0.0/0"]   # tightened in prod to provider's published ranges
      ports: [443]
  ingress:
    fromNamespaces:
      - ingress-nginx

# Probe tuning. Liveness restarts the pod; readiness gates traffic.
probes:
  liveness:
    path: /api/v1/healthz
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /api/v1/healthz
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    path: /api/v1/healthz
    failureThreshold: 30
    periodSeconds: 5

# Environment variables passed to the container. Secrets from
# Secrets Manager are mounted by the External Secrets Operator (out
# of scope here) — the chart references them by env var name.
env:
  log_level: INFO
  database_url_secret_name: qaforge/dev/database_url
  audit_hmac_key_secret_name: qaforge/dev/audit_hmac_key
  github_webhook_secret_name: qaforge/dev/github_webhook_secret
  anthropic_api_key_secret_name: qaforge/dev/anthropic_api_key

# Affinity / topology — encourage spread across AZs.
affinity:
  preferredAntiAffinity: true

# Optional Prometheus ServiceMonitor (when prometheus-operator is installed).
serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics

nameOverride: ""
fullnameOverride: ""
