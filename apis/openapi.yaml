openapi: 3.1.0
info:
  title: QAForge AI API
  version: 0.1.0
  description: |
    Control Plane API for QAForge AI. Implements the surface defined in
    PRD §13. Phase 0 publishes the contract; endpoints are stubs and will
    fill in across Phase 1 and Phase 2.
  contact:
    name: QAForge Engineering
servers:
  - url: http://localhost:8000
    description: Local
  - url: https://api.staging.qaforge.example.com
    description: Staging

tags:
  - name: health
  - name: workspaces
  - name: repositories
  - name: requirements
  - name: test-plans
  - name: test-runs
  - name: agents
  - name: failures
  - name: risk
  - name: approvals
  - name: reports
  - name: evaluations
  - name: audit
  - name: usage

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness
      security: []
      responses:
        "200": { $ref: "#/components/responses/Health" }

  /readyz:
    get:
      tags: [health]
      summary: Readiness
      security: []
      responses:
        "200": { $ref: "#/components/responses/Health" }

  /api/v1/workspaces:
    get:
      tags: [workspaces]
      summary: List workspaces in the caller's tenant
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/UserHeader"
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: include_archived, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [workspaces]
      summary: Create a workspace
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/UserHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/workspaces/{workspace_id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/TenantHeader"
      - $ref: "#/components/parameters/UserHeader"
    get:
      tags: [workspaces]
      summary: Get a workspace
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [workspaces]
      summary: Update a workspace (partial)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/repositories:
    get: { tags: [repositories], summary: List linked repos, responses: { "200": { description: OK } } }
    post: { tags: [repositories], summary: Link a repo, responses: { "201": { description: Created } } }

  /api/v1/requirements:
    post:
      tags: [requirements]
      summary: Ingest a requirement (story, AC, PR diff, OpenAPI, Postman, SQL schema)
      responses:
        "202": { description: Accepted }

  /api/v1/test-plans:
    post:
      tags: [test-plans]
      summary: Generate a test plan from a requirement
      responses:
        "202": { description: Accepted }
  /api/v1/test-plans/{test_plan_id}:
    parameters:
      - $ref: "#/components/parameters/TestPlanId"
    get: { tags: [test-plans], summary: Get a test plan, responses: { "200": { description: OK } } }

  /api/v1/test-runs:
    post: { tags: [test-runs], summary: Start a test run, responses: { "202": { description: Accepted } } }
  /api/v1/test-runs/{test_run_id}:
    parameters:
      - $ref: "#/components/parameters/TestRunId"
    get: { tags: [test-runs], summary: Get a test run, responses: { "200": { description: OK } } }

  /api/v1/agents/tasks:
    get: { tags: [agents], summary: List agent tasks, responses: { "200": { description: OK } } }

  /api/v1/failures/classify:
    post: { tags: [failures], summary: Classify a failure, responses: { "200": { description: OK } } }

  /api/v1/risk/release:
    post: { tags: [risk], summary: Score a release candidate, responses: { "200": { description: OK } } }

  /api/v1/approvals:
    get: { tags: [approvals], summary: List approval requests, responses: { "200": { description: OK } } }
  /api/v1/approvals/{approval_id}:
    parameters:
      - $ref: "#/components/parameters/ApprovalId"
    post:
      tags: [approvals]
      summary: Decide on an approval (approve / reject)
      responses:
        "200": { description: OK }
        "409": { description: Conflict — already decided }

  /api/v1/reports/{test_run_id}:
    parameters:
      - $ref: "#/components/parameters/TestRunId"
    get: { tags: [reports], summary: Fetch the evidence report, responses: { "200": { description: OK } } }

  /api/v1/evaluations:
    get: { tags: [evaluations], summary: List eval runs, responses: { "200": { description: OK } } }
    post: { tags: [evaluations], summary: Trigger an eval run, responses: { "202": { description: Accepted } } }

  /api/v1/audit:
    get: { tags: [audit], summary: Query audit events, responses: { "200": { description: OK } } }

  /api/v1/usage:
    get: { tags: [usage], summary: Per-workspace cost & token usage, responses: { "200": { description: OK } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TenantHeader:
      name: X-QAForge-Tenant-Id
      in: header
      required: true
      description: |
        Caller's tenant id. Phase 1 reads this from a header; Phase 3
        (Story 3.1.3) replaces the header source with verified OIDC claims
        without changing the request shape.
      schema: { type: string, format: uuid }
    UserHeader:
      name: X-QAForge-User-Id
      in: header
      required: false
      description: Caller's user id (optional in Phase 1).
      schema: { type: string, format: uuid }
    TestPlanId:
      name: test_plan_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TestRunId:
      name: test_run_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Health:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [status, version]
            properties:
              status: { type: string, enum: [ok] }
              version: { type: string }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid tenant identity
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Resource conflict (e.g. duplicate name within tenant)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string }
    ApplicationType:
      type: string
      enum:
        - web_api
        - web_ui
        - web_full_stack
        - mobile_app
        - backend_service
        - library
        - other
    WorkspaceCreate:
      type: object
      required: [name, application_type]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        application_type: { $ref: "#/components/schemas/ApplicationType" }
        repo_url: { type: string, maxLength: 500, nullable: true }
        default_branch: { type: string, default: main, minLength: 1, maxLength: 100 }
        environments:
          type: array
          items: { type: string }
          uniqueItems: true
        description: { type: string, maxLength: 1000, nullable: true }
    WorkspaceUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        application_type: { $ref: "#/components/schemas/ApplicationType" }
        repo_url: { type: string, maxLength: 500, nullable: true }
        default_branch: { type: string, minLength: 1, maxLength: 100 }
        environments:
          type: array
          items: { type: string }
          uniqueItems: true
        description: { type: string, maxLength: 1000, nullable: true }
    Workspace:
      type: object
      required:
        - id
        - tenant_id
        - name
        - default_branch
        - application_type
        - environments
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        repo_url: { type: string, nullable: true }
        default_branch: { type: string }
        application_type: { $ref: "#/components/schemas/ApplicationType" }
        environments:
          type: array
          items: { type: string }
        description: { type: string, nullable: true }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: string, format: date-time, nullable: true }
    WorkspaceList:
      type: object
      required: [workspaces, limit, offset]
      properties:
        workspaces:
          type: array
          items: { $ref: "#/components/schemas/Workspace" }
        limit: { type: integer }
        offset: { type: integer }
