[project]
name = "qaforge"
version = "0.0.0"
description = "QAForge AI — agentic software QA platform (workspace root)"
requires-python = ">=3.12"
readme = "README.md"

[tool.uv.workspace]
members = [
  "apps/api",
  "packages/agents",
  "packages/tools",
  "packages/eval",
  "packages/redaction",
]

[tool.uv]
dev-dependencies = [
  "ruff>=0.6.0",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "hypothesis>=6.112",
  "httpx>=0.27",
  "types-pyyaml",
  "pre-commit>=3.8",
]

# --- ruff ---
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = [
  "E", "F", "W",        # pycodestyle, pyflakes
  "I",                  # isort
  "N",                  # pep8-naming
  "UP",                 # pyupgrade
  "B",                  # bugbear
  "S",                  # bandit
  "A",                  # builtins shadowing
  "C4",                 # comprehensions
  "DTZ",                # datetime
  "PTH",                # pathlib
  "RUF",                # ruff-specific
  "SIM",                # simplify
  "TID",                # tidy imports
  "RET",                # return
]
ignore = [
  "S101",  # asserts allowed in tests
  "S105",  # hardcoded password — too noisy in fixtures
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "D"]
# Redaction patterns are dense regex strings that legitimately exceed 100 chars.
"packages/redaction/src/qaforge_redaction/redactor.py" = ["E501"]
# B008 (Depends() in defaults) is the canonical FastAPI dependency-injection idiom.
"apps/api/src/qaforge_api/routers/*.py" = ["B008"]
"apps/api/src/qaforge_api/db/session.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["qaforge_api", "qaforge_agents", "qaforge_tools", "qaforge_eval", "qaforge_redaction"]

[tool.ruff.format]
quote-style = "double"

# --- mypy ---
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_decorators = true
plugins = ["pydantic.mypy"]
mypy_path = [
  "apps/api/src",
  "packages/agents/src",
  "packages/eval/src",
  "packages/redaction/src",
  "packages/tools/src",
]
exclude = ["build/", "dist/", "/migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# --- pytest ---
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]
testpaths = ["apps", "packages"]
asyncio_mode = "auto"
markers = [
  "integration: integration test (requires docker compose stack)",
  "slow: slow test (>2s)",
]

# --- coverage ---
[tool.coverage.run]
branch = true
source = ["apps", "packages"]
omit = ["**/tests/**", "**/migrations/**", "**/__main__.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
