; QAForge Alembic configuration.
; The database URL is NOT set here — it's resolved at runtime from
; QAFORGE_DATABASE_URL via apps/api/migrations/env.py so secrets stay in
; the env layer (per ADR-0008).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
path_separator = os
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60
timezone = UTC
revision_environment = false

[post_write_hooks]
; Run ruff format on generated migration files so they pass lint immediately.
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
