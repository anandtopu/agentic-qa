[project]
name = "aqao-sdk"
version = "0.1.0"
description = "Agentic QA Orchestrator Python SDK — thin wrapper over the REST surface."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Agentic QA Orchestrator" }]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["aqao_sdk/**", "aqao_sdk/py.typed"]
